name: practice
description: "Expense Tracker Flutter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  flutter_dotenv: ^5.1.0

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1

  # Auth & Storage
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.9.0+3

  # UI & Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1
  flutter_signin_button: ^2.1.1

  # Utilities
  intl: ^0.20.2
  permission_handler: ^12.0.1
  url_launcher: ^6.3.1

  # Reports / Export
  pdf: ^3.11.0
  csv: ^6.0.0
  path_provider: ^2.1.3
  open_filex: ^4.4.0
  device_info_plus: ^11.1.0

  # Charts
  fl_chart: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.14

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/login_background.png
    - assets/images/logo.png


    
dependency_overrides:
  archive: ^4.5.2
